<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WalletWave | Login</title>

    <link rel="stylesheet" href="WalletWave.css" />
  </head>

  <body>
    <header class="login-header">
      <h1>Welcome To WalletWave!</h1>

      <p>Your Money, Your Control</p>
    </header>

    <main class="main">
      <div id="container">
        <h2 id="login">Login to Your Account</h2>

        <p class="login-subtitle">Enter your details to continue</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="Email">Email Address</label>

            <input
              type="email"
              id="Email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />

              <button type="button" class="toggle-password" id="togglePassword">
                Show
              </button>
            </div>
          </div>

          <div id="loginMessage"></div>

          <button type="submit" class="button">Login</button>

          <p class="signup-link">
            Don't have an account?
            <a href="SignUp.html">Sign Up</a>
          </p>
        </form>
      </div>
    </main>

    <script src="Login.js"></script>
  </body>
</html>
